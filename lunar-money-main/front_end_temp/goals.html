<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Goals - Lunar Money</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div class="d-flex flex-grow-1">
  <!-- Sidebar -->
  <div id="sidebar"></div>
  <!-- Main Content -->
  <div class="flex-grow-1 d-flex flex-column">
    <!-- Header -->
    <div id="header"></div>

    <div class="container py-5">
      <h3>Financial Goals</h3>
      <p>Set and track long-term savings milestones.</p>

      <!-- Add Goal Form -->
      <div class="card p-4 mt-4">
        <h5>Add Goal</h5>
        <input id="goalTitle" type="text" class="form-control mb-2" placeholder="Goal Title (e.g., Emergency Fund)" />
        <input id="goalTarget" type="number" class="form-control mb-2" placeholder="Target Amount ($)" />
        <input id="currentlySaved" type="number" class="form-control mb-2" placeholder="Currently Saved ($)" />
        <button id="saveGoalBtn" class="btn btn-primary">Save Goal</button>
      </div>

      <!-- Goals List -->
      <div class="card p-4 mt-4">
        <h5>Goals In Progress</h5>
        <div id="goalsList" class="d-flex flex-column gap-3"></div>
      </div>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="goalEditModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Goal</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <label class="form-label">Goal Title</label>
        <input id="editGoalTitle" type="text" class="form-control mb-3">

        <label class="form-label">Target Amount ($)</label>
        <input id="editGoalTarget" type="number" class="form-control mb-3">

        <label class="form-label">Currently Saved ($)</label>
        <input id="editGoalSaved" type="number" class="form-control mb-3">
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-custom-primary" id="saveGoalEditBtn">Save Changes</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="header_script.js"></script>
<script src="darkmode_script.js"></script>

<script>
  const goalTitle = document.getElementById("goalTitle");
  const goalTarget = document.getElementById("goalTarget");
  const currentlySaved = document.getElementById("currentlySaved");
  const saveGoalBtn = document.getElementById("saveGoalBtn");
  const goalsList = document.getElementById("goalsList");

  let editIndex = null;

  saveGoalBtn.addEventListener("click", () => {
    const title = goalTitle.value.trim();
    const target = Number(goalTarget.value.trim());
    const saved = Number(currentlySaved.value.trim()) || 0;

    if (!title || !target || target <= 0) {
      alert("Please enter a valid title and target amount.");
      return;
    }

    const goals = getGoals();
    goals.push({
      id: Date.now(),
      title,
      target,
      saved
    });

    localStorage.setItem("goals", JSON.stringify(goals));
    goalTitle.value = "";
    goalTarget.value = "";
    currentlySaved.value = "";
    renderGoals();
  });

  function getGoals() {
    return JSON.parse(localStorage.getItem("goals")) || [];
  }

  function renderGoals() {
  const goals = getGoals();
  goalsList.innerHTML = "";

  goals.forEach((goal, index) => {
    const progress = Math.min((goal.saved / goal.target) * 100, 100);
    const progressRounded = Math.floor(progress);
    const alertNeeded = progressRounded >= 100;

    const wrapper = document.createElement("div");
    wrapper.className = "p-3 border rounded";

    wrapper.innerHTML = `
      <div class="d-flex justify-content-between align-items-center mb-2">
        <strong>${goal.title}</strong>
        <div>
          <button class="btn btn-sm btn-outline-secondary me-1 edit-goal">Edit</button>
          <button class="btn btn-sm btn-outline-danger delete-goal">Delete</button>
        </div>
      </div>

      <div class="text-center mb-2">
        <span><strong>Saved:</strong> $${goal.saved}</span> <br> 
        <span><strong>Target:</strong> $${goal.target}</span>
      </div>

      <div class="progress mb-2">
        <div class="progress-bar ${alertNeeded ? 'bg-danger' : ''}" 
             role="progressbar"
             style="width:${progressRounded}%;">
          ${progressRounded}%
        </div>
      </div>

      ${alertNeeded ? `<div class="goal-alert text-center"> Goal reached!</div>` : ""}
    `;

    goalsList.appendChild(wrapper);
  });

  attachGoalButtons();
}


  function attachGoalButtons() {
    document.querySelectorAll(".delete-goal").forEach((btn, i) => {
      btn.addEventListener("click", e => {
        const goals = getGoals();
        goals.splice(i, 1);
        localStorage.setItem("goals", JSON.stringify(goals));
        renderGoals();
      });
    });

    document.querySelectorAll(".edit-goal").forEach((btn, i) => {
      btn.addEventListener("click", e => {
        const goals = getGoals();
        editIndex = i;
        document.getElementById("editGoalTitle").value = goals[i].title;
        document.getElementById("editGoalTarget").value = goals[i].target;
        document.getElementById("editGoalSaved").value = goals[i].saved;

        const modal = new bootstrap.Modal(document.getElementById("goalEditModal"));
        modal.show();
      });
    });
  }

  document.getElementById("saveGoalEditBtn").addEventListener("click", () => {
    const goals = getGoals();
    goals[editIndex].title = document.getElementById("editGoalTitle").value;
    goals[editIndex].target = Number(document.getElementById("editGoalTarget").value);
    goals[editIndex].saved = Number(document.getElementById("editGoalSaved").value);

    localStorage.setItem("goals", JSON.stringify(goals));
    bootstrap.Modal.getInstance(document.getElementById("goalEditModal")).hide();
    renderGoals();
  });

  window.addEventListener("storage", e => {
    if (e.key === "totalSavings") renderGoals();
  });

  document.addEventListener("DOMContentLoaded", renderGoals);
</script>
</body>
</html>
