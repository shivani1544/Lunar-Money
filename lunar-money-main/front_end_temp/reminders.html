<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reminders - Lunar Money</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="d-flex flex-grow-1">
    <!-- Sidebar -->
    <div id="sidebar"></div>
    <!-- Main Content -->
    <div class="flex-grow-1 d-flex flex-column">
      <!-- Header -->
      <div id="header"></div>

  <div class="container py-5">
    <h3>Upcoming Reminders</h3>
    <p>Manage bills and other important financial deadlines.</p>

    <div class="card p-4 mt-4">
      <h5>Add Reminder</h5>
      <input type="text" class="form-control mb-2" placeholder="Reminder Title" />
      <input type="date" class="form-control mb-2" />
      <button class="btn btn-primary">Add Reminder</button>
    </div>

    <div class="card p-4 mt-4">
      <h5>Upcoming Items</h5>
      <ul>
        <li>Car Payment – Jan 22</li>
        <li>Credit Card Bill – Jan 30</li>
      </ul>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="header_script.js"></script>
  <script src="darkmode_script.js"></script>
</body>
</html>
