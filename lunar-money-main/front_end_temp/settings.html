<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings - Lunar Money</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    
  </style>
</head>
<body>
  <!-- Header -->
  <div class="flex-grow-1 d-flex flex-column">
      <div id="header">
        </div>

  <!-- Page Content -->
  <div class="content container">
    <h3>Settings</h3>
    <p>This is a placeholder page for your account settings.</p>

    <div class="card p-4 mt-4">
      <h5>Notification Preferences</h5>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" value="" id="emailAlerts">
        <label class="form-check-label" for="emailAlerts">Email Alerts</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" value="" id="smsAlerts">
        <label class="form-check-label" for="smsAlerts">SMS Notifications</label>
      </div>
    </div>

    <div class="card p-4 mt-4">
      <h5>Finance Preferences</h5>
      <p>Select which currency to use.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="header_script.js"></script>
  <script src="darkmode_script.js"></script>
</body>
</html>
